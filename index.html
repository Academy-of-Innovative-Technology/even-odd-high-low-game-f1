<body>

  <main class="container">
 
  </main>
      <button id="generateButton">Generate Random Number</button>
    <p id="randonNbrBtn"></p>

    <button id="submitGuess">Submit Guess</button>
    <p id="submitGuessBtn"></p>

    <button id="resetButton">Reset Guesses</button>
    <p id="resetGuessesBtn"></p>

    <button id="giveUp">Give up</button>

<h1>🎯 Guess The Number Game 🎯</h1>
<div id="game-container">
    <p>Guess a number between 0 and 1000!</p>
    <input type="number" id="guessInput" placeholder="Enter your guess">
    <div>
        <button id="guessBtn">Guess</button>
        <button id="retryBtn">Retry</button>
        <button id="quitBtn">Quit</button>
    </div>
    <div id="hint"></div>
    <div id="stats"></div>
</div>
